[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hippocampus"
version = "0.1.0"
description = "A persistent memory retrieval system for LLMs, accessible via MCP or API"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
hippocampus = "hippocampus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocampus"]
